<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>إدارة التجار — TajirApp</title>
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#0f4c5c">
<link rel="icon" href="icon-192.png">
<style>
  :root {
    --ink: #16262c;
    --muted: #5a6d72;
    --paper: #f2f5f3;
    --card: #ffffff;
    --brand: #0f4c5c;
    --ok: #1c7a4d;
    --ok-bg: #e2f2e9;
    --off: #a8322d;
    --off-bg: #fbe8e6;
    --line: #d3ddd9;
    --focus: #1b6fd1;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  [hidden] { display: none !important; }
  html { -webkit-text-size-adjust: 100%; }
  body {
    font-family: "Segoe UI", Tahoma, "Noto Naskh Arabic", system-ui, sans-serif;
    background: var(--paper);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.6;
    min-height: 100vh;
  }
  :focus-visible { outline: 3px solid var(--focus); outline-offset: 2px; }

  /* ---------- أزرار وحقول ---------- */
  .btn {
    min-height: 44px; padding: 0 18px; border-radius: 8px; border: 1.5px solid transparent;
    font: inherit; font-weight: 700; cursor: pointer; background: var(--card); color: var(--ink);
  }
  .btn:disabled { opacity: 0.55; cursor: default; }
  .btn-primary { background: var(--brand); color: #fff; }
  .btn-ghost { border-color: var(--line); }
  .btn-danger { border-color: var(--off); color: var(--off); }
  .btn-ok { border-color: var(--ok); color: var(--ok); }
  .btn-block { width: 100%; }
  .field { display: block; margin-bottom: 14px; }
  .field > span { display: block; font-weight: 700; margin-bottom: 4px; }
  .lbl { display: block; font-weight: 700; margin-bottom: 4px; }
  .field small { display: block; color: var(--muted); font-size: 12.5px; margin-top: 4px; }
  input[type=text], input[type=email], input[type=password], input[type=search] {
    width: 100%; min-height: 44px; padding: 0 12px; font: inherit; color: var(--ink);
    background: #fff; border: 1.5px solid var(--line); border-radius: 8px;
  }
  input[dir=ltr] { text-align: left; }
  input[aria-invalid=true] { border-color: var(--off); }
  .err { color: var(--off); font-size: 13px; margin-top: 4px; }
  .err:empty, .form-msg:empty, .list-error:empty { display: none; }
  .pw-row { display: flex; gap: 8px; }
  .pw-row input { flex: 1; min-width: 0; }
  .pw-row .btn { min-height: 44px; padding: 0 12px; font-size: 13.5px; }

  /* ---------- الحالات العامة ---------- */
  .center { display: grid; place-items: center; min-height: 100vh; padding: 24px 16px; }
  .boot { color: var(--muted); }
  .login { width: 100%; max-width: 380px; background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 24px 20px; }
  .login h1 { font-size: 20px; color: var(--brand); margin-bottom: 4px; }
  .login p.hint { color: var(--muted); font-size: 13.5px; margin-bottom: 18px; }

  /* ---------- اللوحة ---------- */
  .bar {
    background: var(--brand); color: #fff; padding: 14px 16px calc(14px + env(safe-area-inset-top, 0px)) ;
    display: flex; align-items: center; justify-content: space-between; gap: 12px;
  }
  .bar h1 { font-size: 18px; line-height: 1.3; }
  .bar .who { font-size: 12.5px; opacity: 0.85; word-break: break-all; }
  .bar .btn { min-height: 40px; background: transparent; color: #fff; border-color: rgba(255,255,255,0.55); flex-shrink: 0; }
  main.panel { max-width: 820px; margin: 0 auto; padding: 16px 16px 72px; }

  details.add { background: var(--card); border: 1px solid var(--line); border-radius: 12px; margin-bottom: 16px; }
  details.add > summary {
    list-style: none; cursor: pointer; padding: 14px 16px; font-weight: 700; font-size: 16px; color: var(--brand);
    display: flex; align-items: center; gap: 10px; border-radius: 12px;
  }
  details.add > summary::-webkit-details-marker { display: none; }
  details.add > summary::before {
    content: "+"; display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 50%;
    background: var(--brand); color: #fff; font-size: 18px; line-height: 1;
  }
  details.add[open] > summary::before { content: "–"; }
  details.add form { padding: 4px 16px 16px; border-top: 1px solid var(--line); padding-top: 16px; }
  .form-msg { color: var(--off); font-weight: 700; margin-bottom: 8px; }

  .created { border: 2px solid var(--brand); background: #f7fbfa; border-radius: 12px; padding: 14px 16px; margin-bottom: 16px; }
  .created h2 { font-size: 16px; color: var(--brand); margin-bottom: 8px; }
  .created dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 14px; margin-bottom: 10px; }
  .created dt { color: var(--muted); }
  .created dd { font-weight: 700; word-break: break-all; }
  .created dd.secret span { font-family: ui-monospace, Menlo, Consolas, monospace; font-size: 16px; letter-spacing: 0.02em; }
  .created .note { font-size: 12.5px; color: var(--muted); margin-bottom: 10px; }
  .created .actions { display: flex; gap: 8px; flex-wrap: wrap; }

  .tools { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .filters { display: flex; gap: 8px; flex-wrap: wrap; }
  .filters button {
    min-height: 40px; padding: 0 14px; border-radius: 20px; border: 1.5px solid var(--line); background: #fff;
    font: inherit; font-weight: 700; color: var(--ink); cursor: pointer;
  }
  .filters button[aria-pressed=true] { background: var(--brand); border-color: var(--brand); color: #fff; }
  .filters .count { margin-inline-start: 6px; opacity: 0.85; }
  .list-head { display: flex; align-items: center; justify-content: space-between; margin: 4px 0 8px; }
  .list-head h2 { font-size: 16px; }
  .list-error { color: var(--off); font-weight: 700; margin-bottom: 8px; }
  .empty { color: var(--muted); padding: 22px 8px; text-align: center; }

  ul.rows { list-style: none; display: grid; gap: 10px; }
  .row {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px 14px;
    border-inline-start-width: 6px; display: grid; gap: 6px;
  }
  .row.is-active { border-inline-start-color: var(--ok); }
  .row.is-disabled { border-inline-start-color: var(--off); background: #fdf7f6; }
  .row-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; }
  .row-name { font-size: 16px; word-break: break-word; }
  .badge { font-size: 12.5px; font-weight: 700; padding: 1px 10px; border-radius: 20px; flex-shrink: 0; }
  .badge-active { background: var(--ok-bg); color: var(--ok); }
  .badge-disabled { background: var(--off-bg); color: var(--off); }
  .row-mail { color: var(--muted); font-size: 13.5px; word-break: break-all; }
  .row-key { display: flex; align-items: center; gap: 8px; }
  .key { background: #eaf0ee; border-radius: 6px; padding: 1px 8px; font-size: 13.5px; word-break: break-all; }
  .chip { min-height: 32px; padding: 0 12px; border-radius: 16px; border: 1.5px solid var(--line); background: #fff; font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
  .row-meta { display: flex; flex-wrap: wrap; gap: 2px 16px; color: var(--muted); font-size: 12.5px; }
  .row-action { width: 100%; margin-top: 4px; }

  .toast {
    position: fixed; inset-inline: 16px; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); margin: 0 auto; max-width: 420px;
    background: var(--ink); color: #fff; border-radius: 10px; padding: 0 16px; text-align: center; font-weight: 700;
    min-height: 0; line-height: 44px;
  }
  .toast:empty { display: none; }

  @media (min-width: 720px) {
    .row { grid-template-columns: 1fr auto; align-items: center; column-gap: 16px; }
    .row-head, .row-mail, .row-key, .row-meta { grid-column: 1; }
    .row-head { justify-content: flex-start; }
    .row-action { grid-column: 2; grid-row: 1 / span 4; width: 150px; margin: 0; }
    .tools { flex-direction: row; align-items: center; justify-content: space-between; }
    .tools input[type=search] { max-width: 300px; }
  }
  @media (prefers-reduced-motion: no-preference) {
    .btn, .chip, .filters button { transition: background-color 0.12s, color 0.12s; }
  }
</style>
</head>
<body>

<!-- تحقق أولي من الجلسة -->
<section id="view-boot" class="center">
  <p id="boot-msg" class="boot" role="status">جارٍ التحميل…</p>
</section>

<!-- الدخول -->
<section id="view-login" class="center" hidden>
  <form id="login-form" class="login" autocomplete="on" novalidate>
    <h1>دخول مسؤول النظام</h1>
    <p class="hint">هذه اللوحة لحساب System Admin فقط. حسابات التجار لا تدخلها.</p>
    <label class="field"><span>البريد الإلكتروني</span>
      <input id="login-email" type="email" dir="ltr" autocomplete="username" inputmode="email" autocapitalize="none" autocorrect="off" spellcheck="false" required>
    </label>
    <label class="field"><span>كلمة السر</span>
      <input id="login-password" type="password" dir="ltr" autocomplete="current-password" required>
    </label>
    <p id="login-error" class="err" role="alert"></p>
    <button id="login-submit" type="submit" class="btn btn-primary btn-block">دخول</button>
  </form>
</section>

<!-- اللوحة -->
<section id="view-panel" hidden>
  <header class="bar">
    <div>
      <h1>إدارة التجار</h1>
      <div class="who" id="who" dir="ltr"></div>
    </div>
    <button id="btn-logout" type="button" class="btn">خروج</button>
  </header>

  <main class="panel">
    <details id="add-box" class="add">
      <summary>إضافة تاجر</summary>
      <form id="add-form" novalidate autocomplete="off">
        <label class="field"><span>اسم التاجر</span>
          <input id="f-name" type="text" maxlength="80" autocomplete="off" aria-describedby="err-name">
          <p class="err" id="err-name"></p>
        </label>
        <label class="field"><span>البريد الإلكتروني</span>
          <input id="f-email" type="email" dir="ltr" inputmode="email" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" aria-describedby="err-email">
          <p class="err" id="err-email"></p>
        </label>
        <div class="field"><label class="lbl" for="f-password">كلمة السر</label>
          <div class="pw-row">
            <input id="f-password" type="password" dir="ltr" autocomplete="new-password" autocapitalize="none" autocorrect="off" spellcheck="false" aria-describedby="err-password">
            <button type="button" id="btn-toggle-pw" class="btn btn-ghost">إظهار</button>
            <button type="button" id="btn-generate-pw" class="btn btn-ghost">توليد</button>
          </div>
          <p class="err" id="err-password"></p>
          <small>8 خانات على الأقل. لا تُحفظ في أي مكان بعد الإنشاء.</small>
        </div>
        <label class="field"><span>storeId (اختياري)</span>
          <input id="f-storeId" type="text" dir="ltr" maxlength="64" autocomplete="off" autocapitalize="none" autocorrect="off" spellcheck="false" placeholder="يُولَّد تلقائيًا إذا تُرك فارغًا" aria-describedby="err-storeId">
          <p class="err" id="err-storeId"></p>
        </label>
        <p id="form-msg" class="form-msg" role="alert"></p>
        <button id="btn-create" type="submit" class="btn btn-primary btn-block">إضافة التاجر</button>
      </form>
    </details>

    <section id="created" class="created" hidden aria-live="polite">
      <h2>تم إنشاء حساب التاجر</h2>
      <dl id="created-body"></dl>
      <p class="note">كلمة السر تظهر هنا الآن فقط ولا تُحفظ. سلّمها للتاجر ثم اضغط «تم».</p>
      <div class="actions">
        <button id="btn-copy-login" type="button" class="btn btn-primary">نسخ بيانات الدخول</button>
        <button id="btn-created-done" type="button" class="btn btn-ghost">تم</button>
      </div>
    </section>

    <div class="list-head">
      <h2>التجار</h2>
      <button id="btn-refresh" type="button" class="btn btn-ghost">تحديث</button>
    </div>
    <div class="tools">
      <div class="filters" role="group" aria-label="تصفية حسب الحالة">
        <button type="button" data-filter="all" aria-pressed="true">الكل<span class="count">0</span></button>
        <button type="button" data-filter="active" aria-pressed="false">نشط<span class="count">0</span></button>
        <button type="button" data-filter="disabled" aria-pressed="false">معطّل<span class="count">0</span></button>
      </div>
      <input id="search" type="search" placeholder="ابحث بالاسم أو البريد أو storeId" aria-label="بحث في التجار" autocomplete="off">
    </div>
    <p id="list-error" class="list-error" role="alert"></p>
    <ul id="merchant-list" class="rows"></ul>
    <p id="list-empty" class="empty" hidden></p>
  </main>
</section>

<div id="toast" class="toast" role="status" aria-live="polite"></div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="admin.js"></script>
</body>
</html>
